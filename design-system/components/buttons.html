<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Buttons & Stamps — DOT Navigator</title>
<style>
  :root {
    --ink: oklch(21% 0.018 264); --paper: oklch(96.5% 0.012 83); --muted: oklch(50% 0.016 264);
    --red: oklch(52% 0.214 27); --red2: oklch(44% 0.2 27); --red-soft: oklch(95% 0.035 30); --line: oklch(87% 0.012 83);
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); padding: 40px; }
  .eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
  .stage { display: flex; flex-wrap: wrap; gap: 20px; align-items: center; margin-top: 24px; }
  .btn-primary { display: inline-flex; align-items: center; gap: 8px; border: none; border-radius: 999px; padding: 14px 28px;
    font-weight: 600; color: #fff; background: var(--red); box-shadow: 0 1px 2px rgba(0,0,0,.06); cursor: pointer; font-size: 15px; }
  .btn-ghost { display: inline-flex; align-items: center; gap: 8px; font-weight: 500; color: var(--ink); background: none; border: none; font-size: 15px; cursor: pointer; }
  .stamp { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--red); color: var(--red2); background: var(--red-soft);
    border-radius: 6px; padding: 5px 10px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; }
  .badge { display: inline-flex; align-items: center; border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 500; }
</style>
</head>
<body>
  <span class="eyebrow">DOT Navigator · Components</span>
  <div class="stage">
    <button class="btn-primary">Build my compliance roadmap →</button>
    <button class="btn-ghost">Open the navigator →</button>
  </div>
  <div class="stage">
    <span class="stamp">For first-year FMCSA carriers</span>
    <span class="stamp">⚠ Safety audit</span>
    <span class="badge">Drug &amp; Alcohol</span>
    <span class="badge">Records &amp; Files</span>
  </div>
</body>
</html>
