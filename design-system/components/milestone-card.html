<!-- @dsCard group="Components" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Milestone Card — DOT Navigator</title>
<style>
  :root {
    --ink: oklch(21% 0.018 264); --paper: oklch(96.5% 0.012 83); --surface: oklch(99.2% 0.004 83); --muted: oklch(50% 0.016 264);
    --red: oklch(52% 0.214 27); --brass: oklch(66% 0.12 74); --good: oklch(57% 0.13 152); --steel: oklch(52% 0.07 245);
    --line: oklch(87% 0.012 83); --line2: oklch(78% 0.016 83);
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); padding: 40px; }
  .eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
  .card { display: flex; gap: 16px; max-width: 560px; margin-top: 24px; background: var(--surface);
    border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 12px 28px rgba(0,0,0,.06); padding: 20px; }
  .check { width: 24px; height: 24px; border-radius: 8px; border: 2px solid var(--line2); flex: none; margin-top: 2px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { display: inline-flex; align-items: center; border: 1px solid var(--line2); color: var(--muted); border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 500; }
  .gating { border-color: var(--red); color: var(--red); }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--brass); }
  .dot { width: 8px; height: 8px; border-radius: 999px; background: var(--brass); }
  h3 { margin: 8px 0 4px; font-size: 16px; }
  p { margin: 0; font-size: 14px; color: var(--muted); }
  .meta { display: flex; gap: 12px; margin-top: 10px; align-items: center; }
  time { font-size: 14px; font-weight: 600; }
  .cfr { font-family: var(--mono); font-size: 12px; color: var(--steel); }
</style>
</head>
<body>
  <span class="eyebrow">DOT Navigator · Components</span>
  <div class="card">
    <div class="check"></div>
    <div>
      <div class="row">
        <span class="badge gating">Gating</span>
        <span class="badge">Safety Audit</span>
        <span class="status"><span class="dot"></span> Due soon · 24d</span>
      </div>
      <h3>New Entrant Safety Audit — prepare your audit packet NOW</h3>
      <p>FMCSA conducts a mandatory safety audit within your first 12 months. A failed audit can revoke your new-entrant registration.</p>
      <div class="meta"><time>2026-05-15</time><span class="cfr">49 CFR 385 Subpart D</span></div>
    </div>
  </div>
</body>
</html>
